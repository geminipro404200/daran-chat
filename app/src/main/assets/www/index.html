    /* ================= CRYPTOGRAPHIC HASHING & STRONG PASSWORD ENGINE ================= */
    function hashPassword(password, salt) {
      // Deterministic salted SHA-like 256-bit mixing (sandbox-safe without async race)
      const input = `DARAN_SEC_V3::${salt}::${password}::ARM_EDU`;
      let h1 = 0xdeadbeef ^ input.length, h2 = 0x41c6ce57 ^ input.length;
      let h3 = 0x9e3779b9, h4 = 0x85ebca6b;
      for (let i = 0; i < input.length; i++) {
        const ch = input.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
        h3 = Math.imul(h3 ^ (ch + i), 2246822519);
        h4 = Math.imul(h4 ^ (ch * 31), 3266489917);
      }
      const mix = v => ((v ^ (v >>> 16)) >>> 0).toString(16).padStart(8, '0');
      return 'sha256$' + mix(h1) + mix(h2) + mix(h3) + mix(h4);
    }

    function checkPasswordStrength(pwd, minLen = 8) {
      let score = 0;
      const checks = {
        length: pwd.length >= minLen,
        upper: /[A-Z]/.test(pwd),
        lower: /[a-z]/.test(pwd),
        digit: /[0-9]/.test(pwd),
        symbol: /[^A-Za-z0-9]/.test(pwd)
      };
      Object.values(checks).forEach(ok => { if (ok) score++; });
      return { score, checks, isStrong: checks.length && checks.upper && checks.lower && checks.digit && checks.symbol };
    }

    function generateStrongPassword() {
      const upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
      const lower = 'abcdefghijkmnopqrstuvwxyz';
      const digits = '23456789';
      const syms = '!@#$%&*?';
      const pick = s => s[Math.floor(Math.random() * s.length)];
      let chars = [pick(upper), pick(upper), pick(lower), pick(lower), pick(lower), pick(digits), pick(digits), pick(syms), pick(syms), pick(upper)];
      for (let i = chars.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [chars[i], chars[j]] = [chars[j], chars[i]];
      }
      return chars.join('');
    }

    function generateUsernameFromName(name, prefix = '') {
      const map = {
        'ա':'a','բ':'b','գ':'g','դ':'d','ե':'e','զ':'z','է':'e','ը':'y','թ':'t','ժ':'zh','ի':'i','լ':'l',
        'խ':'kh','ծ':'ts','կ':'k','հ':'h','ձ':'dz','ղ':'gh','ճ':'ch','մ':'m','յ':'y','ն':'n','շ':'sh','ո':'o',
        'չ':'ch','պ':'p','ջ':'j','ռ':'r','ս':'s','վ':'v','տ':'t','ր':'r','ց':'c','ու':'u','փ':'p','ք':'q','և':'ev','օ':'o','ֆ':'f'
      };
      const lower = String(name || 'user').toLowerCase().trim();
      let out = '';
      for (const ch of lower) {
        if (map[ch]) out += map[ch];
        else if (/[a-z0-9]/.test(ch)) out += ch;
        else if (ch === ' ') out += '.';
      }
      out = out.replace(/\.+/g, '.').replace(/^\.|\.$/g, '') || 'user';
      const rand = Math.floor(10 + Math.random() * 89);
      return (prefix ? prefix + '.' : '') + out + rand;
    }

        ],

          attendanceDate: '2026-11-20', studentGradeSubject: 'all', auditSearch: '', subjectSearch: '', messageStatus: 'all'
        }
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.users && parsed.attendanceRecords) {
            const merged = Object.assign(getDefaultState(), parsed);
            if (!Array.isArray(merged.messages)) merged.messages = getDefaultState().messages;
            return merged;
          }
        }
      } catch (e) {}
      try {
        if (window.name && window.name.startsWith('DARAN_STATE::')) {
          const parsed = JSON.parse(window.name.slice('DARAN_STATE::'.length));
          if (parsed && parsed.users && parsed.attendanceRecords) {
            return Object.assign(getDefaultState(), parsed);
          }
        }
      } catch (e) {}
      return getDefaultState();
    }

    let state = loadState();
    let chartInstances = [];
    let otpInterval = null;

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        window.name = 'DARAN_STATE::' + JSON.stringify(state);
      } catch (e) {
        try { window.name = 'DARAN_STATE::' + JSON.stringify(state); } catch (err) {}
      }
    }

    function nowTimestamp() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function getCurrentUser() { return state.users.find(u => u.id === state.currentUserId) || null; }
    function getUserById(id) { return state.users.find(u => u.id === id); }
    function getSchoolById(id) { return state.schools.find(s => s.id === id); }
    function getTeachers(schoolId = null) { return state.users.filter(u => u.role === 'teacher' && (!schoolId || u.schoolId === schoolId)); }
    function getStudents(schoolId = null) { return state.users.filter(u => u.role === 'student' && (!schoolId || u.schoolId === schoolId)); }
    function getOperators() { return state.users.filter(u => u.role === 'school_op'); }
    function getClasses(schoolId = null) { return state.classes.filter(c => !schoolId || c.schoolId === schoolId); }

    function getStudentAverage(studentId, subject = null) {
      const list = state.grades.filter(g => g.studentId === studentId && (!subject || g.subject === subject));
      if (!list.length) return null;
      return (list.reduce((a, g) => a + Number(g.score), 0) / list.length).toFixed(1);
    }

    function getAttendanceStats(studentId) {
      const recs = state.attendanceRecords.filter(r => r.studentId === studentId);
      const present = recs.filter(r => r.status === 'Ն').length;
      const absent = recs.filter(r => r.status === 'Բ').length;
      const excused = recs.filter(r => r.status === 'Հ').length;
      const late = recs.filter(r => r.status === 'Ու').length;
      const total = recs.length;
      const pct = total ? Math.round(((present + late) / total) * 100) : 100;
      return { total, present, absent, excused, late, pct, recs };
    }

    function getAttendanceForDate(studentId, date) {
      return state.attendanceRecords.find(r => r.studentId === studentId && r.date === date);
    }

    function attBadge(status) {
      if (status === 'Ն') return 'bg-emerald-100 text-emerald-800 border-emerald-300 dark:bg-emerald-900/50 dark:text-emerald-300 dark:border-emerald-700';
      if (status === 'Բ') return 'bg-rose-100 text-rose-800 border-rose-300 dark:bg-rose-900/50 dark:text-rose-300 dark:border-rose-700';
      if (status === 'Հ') return 'bg-amber-100 text-amber-800 border-amber-300 dark:bg-amber-900/50 dark:text-amber-300 dark:border-amber-700';
      if (status === 'Ու') return 'bg-sky-100 text-sky-800 border-sky-300 dark:bg-sky-900/50 dark:text-sky-300 dark:border-sky-700';
      return 'bg-slate-100 text-slate-400 border-slate-200 dark:bg-slate-800 dark:border-slate-700';
    }

    function attLabel(status) {
      if (status === 'Ն') return 'Ներկա';
      if (status === 'Բ') return 'Անհարգելի բացակա';
      if (status === 'Հ') return 'Հարգելի բացակա';
      if (status === 'Ու') return 'Ուշացում';
      return 'Չնշված';
    }

    function addAuditLog(action, target, severity = 'info', actorOverride = null) {
      const u = actorOverride || getCurrentUser();
      state.auditLogs.unshift({
        id: 'log-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
        time: nowTimestamp(),
        actor: u ? `${u.name} (@${u.username})` : 'Համակարգ',
        role: u ? ROLE_META[u.role].label : 'Անվտանգություն',
        action, target, severity
      });
      if (state.auditLogs.length > 100) state.auditLogs.pop();
      saveState();
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function scoreBadgeClass(score) {
      const n = Number(score);
      if (n >= 9) return 'bg-emerald-100 text-emerald-800 border-emerald-200 dark:bg-emerald-900/40 dark:text-emerald-300 dark:border-emerald-800';
      if (n >= 7) return 'bg-sky-100 text-sky-800 border-sky-200 dark:bg-sky-900/40 dark:text-sky-300 dark:border-sky-800';
      if (n >= 5) return 'bg-amber-100 text-amber-800 border-amber-200 dark:bg-amber-900/40 dark:text-amber-300 dark:border-amber-800';
      return 'bg-rose-100 text-rose-800 border-rose-200 dark:bg-rose-900/40 dark:text-rose-300 dark:border-rose-800';
    }

    function showToast(message, type = 'info') {
      const root = document.getElementById('toast-root');
      if (!root) return;
      const styles = {
        info: 'bg-slate-900 text-white border-slate-700',
        success: 'bg-emerald-600 text-white border-emerald-500',
        warning: 'bg-amber-600 text-white border-amber-500',
        error: 'bg-rose-600 text-white border-rose-500',
        security: 'bg-indigo-700 text-white border-indigo-500'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto fade-in flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium ${styles[type] || styles.info}`;
      el.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle-2' : type === 'error' ? 'shield-x' : type === 'security' ? 'shield-alert' : 'info'}" class="w-4 h-4 shrink-0"></i><span>${escapeHtml(message)}</span>`;
      root.appendChild(el);
      if (window.lucide) window.lucide.createIcons();
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 260); }, 3500);
    }

    function checkScheduleConflict(schoolId, day, time, className, teacherId) {
      const teacher = getUserById(teacherId);

      }
      for (const sl of state.scheduleSlots) {
        if (sl.day === day && sl.time === time) {

            return `Կոնֆլիկտ․ ուսուցիչ ${teacher.name} արդեն դաս ունի ${day} ${time}-ին ${sl.className} դասարանում (${sl.subject})։`;

      return null;
    }

                  ${escapeHtml(user.name.split(' ').map(w => w[0]).join('').slice(0, 2))}
                </div>
                <div class="min-w-0">
                  <p class="text-sm font-bold truncate">${escapeHtml(user.name)}</p>
                  <p class="text-xs text-slate-400 font-mono truncate">@${escapeHtml(user.username)}</p>
                </div>
              </div>
              <div class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-[11px]">
                <span class="text-slate-500">RBAC</span>
                <span class="px-2 py-0.5 rounded-full border font-semibold ${role.badgeClass}">${role.level}</span>
              </div>
            </div>

            <nav class="space-y-1">
              ${role.tabs.map(tab => {
                const unreadCount = (user.role === 'chief' && tab.id === 'messages')
                  ? (state.messages || []).filter(m => m.status === 'unread').length
                  : 0;
                return `
                <button type="button" data-action="switch-tab" data-tab="${tab.id}"
                  class="w-full flex items-center justify-between gap-2 px-3.5 py-2.5 rounded-xl text-sm font-semibold transition-all text-left ${activeTab === tab.id
                    ? 'brand-gradient text-white shadow-md shadow-sky-500/20'
                    : 'text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-900'}">
                  <span class="flex items-center gap-3 min-w-0">
                    <i data-lucide="${tab.icon}" class="w-4 h-4 shrink-0"></i>
                    <span class="truncate">${tab.label}</span>
                  </span>
                  ${unreadCount > 0 ? `<span class="px-2 py-0.5 rounded-full text-[11px] font-extrabold ${activeTab === tab.id ? 'bg-white/25 text-white' : 'bg-rose-500 text-white'}">${unreadCount}</span>` : ''}
                </button>`;
              }).join('')}

            <div class="mt-5 p-4 rounded-2xl bg-slate-900 text-slate-100 border border-slate-800">

              </div>
              <p class="text-[11px] text-slate-300 leading-relaxed">AI-ն գեներացնում է միայն թեմաներ և մեկուսացված է գնահատականներից։</p>
            </div>
          </aside>

          <main class="flex-1 min-w-0 fade-in">
            ${renderMainContent(user, activeTab)}
          </main>
        </div>
      `;

      if (window.lucide) window.lucide.createIcons();
      initCharts(user.role, activeTab);
      bindInlineForms();
    }

    function renderMainContent(user, tab) {
      if (tab === 'profile') return renderProfileView(user);
      if (user.role === 'chief') {
        if (tab === 'dashboard') return renderChiefDashboard();
        if (tab === 'schools') return renderChiefSchools();
        if (tab === 'operators') return renderChiefOperators();
        if (tab === 'subjects') return renderChiefSubjects();
        if (tab === 'messages') return renderChiefMessages();
        if (tab === 'security') return renderChiefSecurity();
      }
      if (user.role === 'school_op') {
        if (tab === 'overview') return renderSchoolOverview(user);
        if (tab === 'classes') return renderSchoolClasses(user);
        if (tab === 'teachers') return renderSchoolTeachers(user);
        if (tab === 'students') return renderSchoolStudents(user);
        if (tab === 'schedule') return renderSchoolSchedule(user);
        if (tab === 'access') return renderSchoolAccessSecurity(user);
        if (tab === 'messages') return renderSchoolMessages(user);
      }
      if (user.role === 'teacher') {
        if (tab === 'topics') return renderTeacherTopics(user);
        if (tab === 'homework') return renderTeacherHomework(user);
        if (tab === 'gradebook') return renderTeacherGradebook(user);
        if (tab === 'attendance') return renderTeacherAttendance(user);
        if (tab === 'my_schedule') return renderTeacherSchedule(user);
      }
      if (user.role === 'student') {
        if (tab === 'overview') return renderStudentOverview(user);
        if (tab === 'grades') return renderStudentGrades(user);
        if (tab === 'attendance') return renderStudentAttendance(user);
        if (tab === 'homework') return renderStudentHomework(user);
        if (tab === 'topics') return renderStudentTopics(user);
        if (tab === 'schedule') return renderStudentSchedule(user);
      }
      return '';
    }

            <p class="text-sm text-slate-500">Մուտքանուն՝ <strong class="font-mono">@${escapeHtml(user.username)}</strong> · ${ROLE_META[user.role].label}${school ? ' · ' + escapeHtml(school.name) : ''}</p>

              <div><label class="block text-xs font-semibold mb-1">Էլ․ փոստ</label><input name="email" type="email" value="${escapeHtml(user.email || '')}" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm"></div>

              <div><label class="block text-xs font-semibold mb-1">Ծննդյան ամսաթիվ</label><input name="birthDate" type="date" value="${escapeHtml(user.birthDate || '')}" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm"></div>

              <input name="newPassword" type="password" placeholder="A-Z, a-z, 0-9, !@# (≥8 նիշ)" class="w-full sm:w-1/2 px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">

            <div class="flex justify-end"><button type="submit" class="px-5 py-2.5 rounded-xl brand-gradient text-white text-sm font-bold shadow-md">Պահպանել փոփոխությունները</button></div>

    /* ================= CHIEF OPERATOR VIEWS ================= */

    function renderChiefSchools() {

          <input type="text" data-filter="schoolSearch" value="${escapeHtml(state.filters.schoolSearch)}" placeholder="Որոնել դպրոց..." class="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm">

              <p class="text-sm text-slate-500">Ավելացրեք, խմբագրեք, կողպեք կամ ջնջեք դպրոցի օպերատորների հաշիվները</p>

      const list = f === 'all' ? all : all.filter(m => m.status === f);
      const unreadCount = all.filter(m => m.status === 'unread').length;

      return `

          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="text-xl font-extrabold">Նամակներ դպրոցների օպերատորներից</h1>
              <p class="text-sm text-slate-500">Ընդհանուր ${all.length} նամակ · ${unreadCount} չկարդացված</p>

          <div class="space-y-4">

              const sender = getUserById(m.fromUserId);
              const sch = getSchoolById(m.schoolId);
              return `
                <div class="bg-white dark:bg-slate-900 rounded-2xl border ${m.status === 'unread' ? 'border-sky-400 dark:border-sky-600 shadow-md' : 'border-slate-200 dark:border-slate-800 shadow-sm'} p-5 space-y-3">
                  <div class="flex flex-wrap items-start justify-between gap-2">
                    <div>
                      <div class="flex flex-wrap items-center gap-2 mb-1">

    /* ================= TEACHER VIEWS (INCLUDING DATE-BY-DATE ATTENDANCE) ================= */
    function renderTeacherBar(user) {
      const schoolClassNames = getClasses(user.schoolId).map(c => c.name);
      const classes = (user.classes && user.classes.length) ? user.classes.filter(c => schoolClassNames.includes(c)) : schoolClassNames;
      if (classes.length && !classes.includes(state.filters.teacherClass)) state.filters.teacherClass = classes[0];
      const subjects = (user.subjects && user.subjects.length) ? user.subjects : state.subjects;
      return `
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-3.5 shadow-sm flex flex-wrap items-center justify-between gap-3 mb-5">
          <div class="flex flex-wrap items-center gap-3">
            <select data-filter="teacherClass" class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-bold">${classes.map(c => `<option ${state.filters.teacherClass === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}</select>
            <select data-filter="teacherSubject" class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-bold">${subjects.map(s => `<option ${state.filters.teacherSubject === s ? 'selected' : ''}>${escapeHtml(s)}</option>`).join('')}</select>
          </div>
          <span class="px-3 py-1 rounded-full bg-teal-50 dark:bg-teal-950/60 text-teal-700 dark:text-teal-300 text-xs font-semibold">AI-ն միայն թեմաների համար է</span>
        </div>
      `;
    }

        <div>

            <h1 class="text-xl font-extrabold">Ուսումնական թեմաներ</h1>

              <button type="button" data-action="open-ai-topic" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl brand-gradient text-white text-sm font-bold"><i data-lucide="sparkles" class="w-4 h-4"></i> AI Թեմայի գեներացիա</button>
              <button type="button" data-action="open-add-topic" class="px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm font-semibold">+ Ձեռքով</button>

          <div class="space-y-3">

          </div>
        </div>
      `;
    }

    function renderTeacherHomework(user) {
      const list = state.homeworks.filter(h => (!h.schoolId || h.schoolId === user.schoolId) && h.className === state.filters.teacherClass);
      return `

          ${renderTeacherBar(user)}

      const students = getStudents(user.schoolId).filter(s => s.className === state.filters.teacherClass);
      const subject = state.filters.teacherSubject;
      return `
        <div>
          ${renderTeacherBar(user)}
          <div class="mb-4 p-3.5 rounded-2xl bg-slate-900 text-white border border-amber-400/40 flex items-center justify-between text-xs">
            <span><strong class="text-amber-300">Միայն ուսուցչի ձեռքով գնահատում․</strong> AI միջամտությունը բացառված է։</span>

                <thead><tr class="border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/60 text-xs uppercase text-slate-500"><th class="py-3 px-4">Աշակերտ</th><th class="py-3 px-4">Գնահատականներ (${escapeHtml(subject)})</th><th class="py-3 px-4 text-center">Միջին</th><th class="py-3 px-4 text-right">Գործողություն</th></tr></thead>

                  ${students.length ? students.map(stu => {

                  }).join('') : '<tr><td colspan="4" class="py-8 text-center text-xs text-slate-400">Ձեր դպրոցի այս դասարանում աշակերտներ չկան</td></tr>'}

    function renderTeacherAttendance(user) {

      return `

                  <tr class="border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/60 text-xs text-slate-500">
                    <th class="py-3 px-4 font-bold">Աշակերտ</th>

                  </tr>

                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">

                          return `
                            <td class="py-2.5 px-2 text-center">
                              <button type="button" data-action="cycle-attendance" data-student-id="${stu.id}" data-date="${d}"

                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;

            }).join('')}
          </div>
        </div>
      `;
    }

    /* ================= LOGIN & INLINE FORM HANDLERS ================= */
    function bindLoginForms() {
      const lf = document.getElementById('login-form');
      if (lf) {
        lf.addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(lf);
          const uname = String(fd.get('username') || '').trim().replace(/^@/, '').toLowerCase();
          const pass = String(fd.get('password') || '');
          const user = state.users.find(u => u.username.toLowerCase() === uname);
          if (!user) { state.loginError = 'Նշված մուտքանունով (Username) հաշիվ չի գտնվել։'; return renderApp(); }
          if (user.locked) { state.loginError = 'Հաշիվը կողպված է։ Դիմեք օպերատորին՝ ապակողպելու համար։'; return renderApp(); }
          if (hashPassword(pass, user.salt) !== user.passwordHash) {
            user.failedAttempts = (user.failedAttempts || 0) + 1;
            if (user.failedAttempts >= state.securityPolicies.maxFailedAttempts) {
              user.locked = true;
              addAuditLog('Brute-force կողպում', '@' + user.username, 'security', user);
              state.loginError = `Հաշիվը կողպվեց ${state.securityPolicies.maxFailedAttempts} սխալ փորձից հետո։`;
            } else {
              state.loginError = `Սխալ գաղտնաբառ (${user.failedAttempts}/${state.securityPolicies.maxFailedAttempts})։`;
            }
            saveState(); return renderApp();
          }
          user.failedAttempts = 0; state.loginError = '';
          if (user.mustChangePassword) {
            state.pendingUserId = user.id; state.loginStep = 'force_change'; return renderApp();
          }
          completeLogin(user);
        });
      }



      const fpf = document.getElementById('force-pass-form');
      if (fpf) {
        fpf.addEventListener('submit', (e) => {
          e.preventDefault();
          const np = String(new FormData(fpf).get('newPassword') || '').trim();
          const st = checkPasswordStrength(np, state.securityPolicies.minPasswordLen);
          if (state.securityPolicies.enforceStrongPasswords && !st.isStrong) {
            state.loginError = 'Գաղտնաբառը պետք է ունենա ≥8 նիշ, մեծատառ, փոքրատառ, թիվ և հատուկ նիշ։';
            return renderApp();
          }
          const u = getUserById(state.pendingUserId);
          u.passwordHash = hashPassword(np, u.salt);
          u.mustChangePassword = false;
          saveState();
          completeLogin(u);
        });
      }
    }



    function completeLogin(u) {
      clearOtpTimer();
      state.currentUserId = u.id;
      state.isAuthenticated = true;
      state.sessionToken = 'tok_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
      state.sessionStartedAt = Date.now();
      state.loginStep = 'credentials';
      state.loginError = '';
      addAuditLog('Հաջողված անվտանգ մուտք (Username + SHA-256)', '@' + u.username, 'security', u);
      saveState();
      renderApp();
      showToast(`Բարի գալուստ, ${u.name}`, 'success');
    }

    function bindInlineForms() {
      const pf = document.getElementById('profile-edit-form');
      if (pf) {
        pf.addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(pf);
          const u = getCurrentUser();
          const newUname = String(fd.get('username') || '').trim().toLowerCase();
          if (state.users.some(x => x.id !== u.id && x.username.toLowerCase() === newUname)) {
            return showToast('Այս մուտքանունն արդեն զբաղված է', 'error');
          }
          const np = String(fd.get('newPassword') || '').trim();
          if (np && state.securityPolicies.enforceStrongPasswords && !checkPasswordStrength(np, state.securityPolicies.minPasswordLen).isStrong) {
            return showToast('Գաղտնաբառը թույլ է (անհրաժեշտ է A-Z, a-z, 0-9, !@# և ≥8 նիշ)', 'warning');
          }
          u.name = String(fd.get('name')).trim();
          u.username = newUname;
          u.email = String(fd.get('email') || '').trim();
          u.phone = String(fd.get('phone') || '').trim();
          u.birthDate = String(fd.get('birthDate') || '');
          u.address = String(fd.get('address') || '').trim();
          if (u.role === 'student') u.parentPhone = String(fd.get('parentPhone') || '').trim();
          if (np) { u.passwordHash = hashPassword(np, u.salt); }
          addAuditLog('Անձնական տվյալների խմբագրում', '@' + u.username, 'info');
          saveState(); renderApp(); showToast('Բոլոր փոփոխությունները հաջողությամբ պահպանվեցին', 'success');
        });
      }

      const sf = document.getElementById('add-subject-form');
      if (sf) {
        sf.addEventListener('submit', (e) => {
          e.preventDefault();
          const sub = String(new FormData(sf).get('subject') || '').trim();
          if (sub && !state.subjects.includes(sub)) { state.subjects.unshift(sub); saveState(); renderApp(); showToast('Առարկան ավելացվեց', 'success'); }
        });
      }

      const imp = document.getElementById('import-db-input');
      if (imp) {
        imp.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              if (!parsed.users || !parsed.schools) throw new Error('invalid');
              state = Object.assign(getDefaultState(), parsed, { isAuthenticated: true, currentUserId: state.currentUserId });
              saveState(); renderApp();
              showToast('Տվյալների բազան հաջողությամբ ներմուծվեց և սինխրոնացվեց', 'success');
            } catch (err) {
              showToast('Սխալ JSON ֆայլ', 'error');
            }
          };
          reader.readAsText(file);
        });
      }
    }

        const u = getCurrentUser();
        const subject = fd.get('subject').trim();
        state.messages.unshift({
          id: 'msg-' + Date.now(),
          fromUserId: u.id,
          schoolId: u.schoolId,
          subject,
          priority: fd.get('priority'),
          body: fd.get('body').trim(),
          createdAt: nowTimestamp(),
          status: 'unread',
          replyText: '',
          repliedAt: '',
          repliedBy: ''
        });
        addAuditLog('Նամակ գլխավոր օպերատորին', subject, 'info');
        closeModal(); saveState(); renderApp();
        showToast('Նամակը հաջողությամբ ուղարկվեց գլխավոր օպերատորին', 'success');
      });
    }

    function openReplyMsgModal(msgId) {
      const m = (state.messages || []).find(x => x.id === msgId);
      if (!m) return;
      openModal(`Պատասխանել՝ ${escapeHtml(m.subject)}`, `
        <form id="reply-msg-form" class="space-y-3.5">
          <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/70 text-xs text-slate-600 dark:text-slate-300">${escapeHtml(m.body)}</div>
          <div>
            <label class="block text-xs font-semibold mb-1">Գլխավոր օպերատորի պատասխանը</label>
            <textarea name="replyText" rows="4" required placeholder="Գրեք Ձեր պատասխանը դպրոցի օպերատորին..." class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm">${escapeHtml(m.replyText || '')}</textarea>
          </div>
          <button type="submit" class="w-full py-2.5 rounded-xl brand-gradient text-white text-sm font-bold shadow-md">Ուղարկել պատասխանը</button>
        </form>
      `);
      document.getElementById('reply-msg-form').addEventListener('submit', (e) => {
        e.preventDefault();
        m.replyText = new FormData(e.target).get('replyText').trim();
        m.repliedAt = nowTimestamp();
        m.repliedBy = getCurrentUser().name;
        m.status = 'replied';
        addAuditLog('Պատասխան դպրոցի օպերատորի նամակին', m.subject, 'success');
        closeModal(); saveState(); renderApp();
        showToast('Պատասխանն ուղարկվեց դպրոցի օպերատորին', 'success');
      });
    }

    /* ================= EVENT DELEGATION ================= */
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const a = btn.dataset.action;

      if (a === 'close-modal') return closeModal();
      if (a === 'toggle-theme') { state.darkMode = !state.darkMode; saveState(); return renderApp(); }
      if (a === 'toggle-login-pass') {
        const inp = document.getElementById('login-password');
        if (inp) inp.type = inp.type === 'password' ? 'text' : 'password';
        return;
      }
      if (a === 'delete-grade') {
        const g = state.grades.find(x => x.id === btn.dataset.id);
        if (g) {
          state.grades = state.grades.filter(x => x.id !== g.id);
          addAuditLog('Գնահատականի հեռացում', `${getUserById(g.studentId)?.name || ''} · ${g.subject} (${g.score})`, 'info');
          saveState(); renderApp(); showToast('Գնահատականը հեռացվեց', 'info');
        }
        return;
      }
      if (a === 'toggle-mobile-menu') { state.mobileMenuOpen = !state.mobileMenuOpen; return renderApp(); }
      if (a === 'logout') {
        addAuditLog('Դուրս գալ համակարգից', '@' + (getCurrentUser()?.username || ''), 'security');
        state.isAuthenticated = false; state.currentUserId = null; state.sessionToken = null; state.loginStep = 'credentials'; state.loginError = '';
        saveState(); return renderApp();
      }
      if (a === 'back-to-login') { state.loginStep = 'credentials'; state.loginError = ''; return renderApp(); }
      if (a === 'fill-login') {
        const u = document.getElementById('login-username'), p = document.getElementById('login-password');
        if (u) u.value = btn.dataset.username; if (p) p.value = btn.dataset.pass;
        return;
      }
      if (a === 'switch-tab') { state.activeTabs[getCurrentUser().role] = btn.dataset.tab; state.mobileMenuOpen = false; saveState(); return renderApp(); }

      if (a === 'open-add-school') return openSchoolModal();
      if (a === 'open-edit-school') return openSchoolModal(btn.dataset.id);
      if (a === 'open-add-operator') return openOperatorModal();
      if (a === 'open-edit-operator') return openOperatorModal(btn.dataset.id);
      if (a === 'open-add-teacher') return openTeacherModal();
      if (a === 'open-edit-teacher') return openTeacherModal(btn.dataset.id);
      if (a === 'open-add-student') return openStudentModal();
      if (a === 'open-edit-student') return openStudentModal(btn.dataset.id);
      if (a === 'open-add-class') return openAddClassModal();
      if (a === 'open-add-slot') return openAddSlotModal();
      if (a === 'open-reset-pass') return openResetPassModal(btn.dataset.id);
      if (a === 'open-ai-topic') return openAiTopicModal();
      if (a === 'open-add-topic') return openAddTopicModal();
      if (a === 'open-add-hw') return openAddHomeworkModal();
      if (a === 'open-add-grade') return openAddGradeModal(btn.dataset.studentId);
      if (a === 'open-compose-msg') return openComposeMsgModal();
      if (a === 'open-reply-msg') return openReplyMsgModal(btn.dataset.id);
      if (a === 'mark-msg-read') {
        const m = (state.messages || []).find(x => x.id === btn.dataset.id);
        if (m) { m.status = 'read'; saveState(); renderApp(); showToast('Նշվեց որպես կարդացված', 'info'); }
        return;
      }
      if (a === 'delete-msg') {
        state.messages = (state.messages || []).filter(x => x.id !== btn.dataset.id);
        saveState(); renderApp(); showToast('Նամակը հեռացվեց', 'info');
        return;
      }

      if (a === 'cycle-attendance') {
        const stuId = btn.dataset.studentId, date = btn.dataset.date;
        const stuObj = getUserById(stuId);
        if (!stuObj || stuObj.schoolId !== getCurrentUser()?.schoolId) return showToast('Արգելված է․ աշակերտը այլ դպրոցից է', 'error');
        const order = ['Ն', 'Բ', 'Հ', 'Ու'];
        const rec = getAttendanceForDate(stuId, date);
        if (!rec) {
          state.attendanceRecords.push({ id: 'att-' + Date.now(), studentId: stuId, date, status: 'Ն', subject: state.filters.teacherSubject, note: '' });
        } else {
          const next = order[(order.indexOf(rec.status) + 1) % order.length];
          rec.status = next;
          rec.subject = state.filters.teacherSubject;
          rec.note = next === 'Բ' ? 'Անհարգելի բացակա' : next === 'Հ' ? 'Հարգելի բացակա' : next === 'Ու' ? 'Ուշացում' : '';
        }
        saveState(); renderApp(); return;
      }

      if (a === 'delete-school') { state.schools = state.schools.filter(s => s.id !== btn.dataset.id); saveState(); return renderApp(); }
      if (a === 'delete-operator' || a === 'delete-user') {
        const u = getUserById(btn.dataset.id);
        if (u && !u.protected) { state.users = state.users.filter(x => x.id !== u.id); addAuditLog('Օգտատիրոջ հեռացում', '@' + u.username, 'security'); saveState(); renderApp(); }
        return;
      }
      if (a === 'toggle-user-lock') {
        const u = getUserById(btn.dataset.id);
        if (u && !u.protected) { u.locked = !u.locked; u.failedAttempts = 0; addAuditLog(u.locked ? 'Կողպում' : 'Ապակողպում', '@' + u.username, 'security'); saveState(); renderApp(); }
        return;
      }
      if (a === 'toggle-user-2fa') { const u = getUserById(btn.dataset.id); if (u) { u.twoFA = !u.twoFA; saveState(); renderApp(); } return; }
      if (a === 'delete-subject') { state.subjects = state.subjects.filter(s => s !== btn.dataset.name); saveState(); return renderApp(); }
      if (a === 'delete-class') { state.classes = state.classes.filter(c => c.id !== btn.dataset.id); saveState(); return renderApp(); }
      if (a === 'delete-slot') { state.scheduleSlots = state.scheduleSlots.filter(s => s.id !== btn.dataset.id); saveState(); return renderApp(); }
      if (a === 'delete-topic') { state.topics = state.topics.filter(t => t.id !== btn.dataset.id); saveState(); return renderApp(); }
      if (a === 'delete-hw') { state.homeworks = state.homeworks.filter(h => h.id !== btn.dataset.id); saveState(); return renderApp(); }
      if (a === 'toggle-policy') { state.securityPolicies[btn.dataset.key] = !state.securityPolicies[btn.dataset.key]; saveState(); return renderApp(); }
      if (a === 'export-db') {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = 'daran-database-sync.json'; link.click(); URL.revokeObjectURL(url);
        return showToast('Ամբողջական տվյալների բազան արտահանվեց', 'success');
      }
      if (a === 'reset-demo') { state = getDefaultState(); saveState(); renderApp(); return showToast('Տվյալները վերականգնվեցին', 'info'); }
      if (a === 'toggle-student-hw') {
        const hw = state.homeworks.find(h => h.id === btn.dataset.id);
        const uid = getCurrentUser().id;
        if (hw) { const i = hw.completedBy.indexOf(uid); if (i >= 0) hw.completedBy.splice(i, 1); else hw.completedBy.push(uid); saveState(); renderApp(); }
      }
    });

    document.addEventListener('input', (e) => {
      const f = e.target.dataset.filter;
      if (f && e.target.tagName === 'INPUT' && e.target.type !== 'date') {
        state.filters[f] = e.target.value;
        const pos = e.target.selectionStart;
        renderApp();
        const next = document.querySelector(`[data-filter="${f}"]`);
        if (next) { next.focus(); try { next.setSelectionRange(pos, pos); } catch (err) {} }
      }
    });

    document.addEventListener('change', (e) => {
      const f = e.target.dataset.filter;
      if (f) { state.filters[f] = e.target.value; saveState(); return renderApp(); }
      if (e.target.dataset.policySelect) { state.securityPolicies[e.target.dataset.policySelect] = Number(e.target.value); saveState(); showToast('Պահպանվեց', 'security'); }
    });

    window.addEventListener('DOMContentLoaded', () => renderApp());
  </script>
</body>
</html>
